<style>
/* Layout: full-bleed 3D viewport with a white side menu in the erra.co.il language (Arimo, brand blue #0050c9, cyan accent, 8–12px corners); the menu becomes a bottom sheet on phones */
:root{
  --bg:#ffffff; --panel:#ffffff; --fg:#1f1f1f; --muted:#6e6e6e; --line:#e6e6e6; --soft:#f7f7f7;
  --brand:#0050c9; --brand-hover:#0065ff; --brand-soft:#eef3fc; --cyan:#2abdd5; --ink:#fdfdfd;
  --f-body:Arimo, 'Segoe UI', Arial, sans-serif; --f-num:Inter, Arimo, Arial, sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;overflow:hidden}
.app{display:grid;grid-template-columns:380px minmax(0,1fr);height:100%}
.panel{background:var(--panel);border-inline-end:1px solid var(--line);overflow-y:auto;
  padding-block:22px 30px;padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:26px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.topbar .logo{width:74px;height:23px;flex:none}
.topbar .tagline{font-size:12.5px;color:var(--muted)}
.brand{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:12.5px;color:var(--cyan);font-weight:700;letter-spacing:.03em}
h1{font-family:var(--f-body);font-weight:700;font-size:30px;line-height:1.12;margin:0;color:var(--fg);text-wrap:balance}
.sub{color:var(--muted);font-size:14px;margin:0;line-height:1.5}
.sec{display:flex;flex-direction:column;gap:12px}
.sec h2{font-size:16px;font-weight:700;color:var(--fg);margin:0;border-inline-start:2px solid var(--brand);padding-inline-start:10px;line-height:1.3}
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg.two{grid-template-columns:repeat(2,1fr)}
.seg button{border:0;background:transparent;color:var(--fg);font:400 14px var(--f-body);padding:9px 4px;border-radius:8px;cursor:pointer;transition:background-color .2s,color .2s}
.seg button:hover{color:var(--brand)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--ink);font-weight:700}
button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.rooms{display:flex;flex-direction:column;gap:8px}
.rooms-h{font-size:12.5px;font-weight:700;color:var(--muted);margin-top:2px}
.rooms-row{display:flex;flex-wrap:wrap;gap:6px}
.rooms button{border:1px solid var(--line);background:#fff;color:var(--fg);font:400 13px var(--f-body);padding:6px 12px;border-radius:999px;cursor:pointer;transition:border-color .2s,color .2s}
.rooms button:hover{border-color:var(--brand);color:var(--brand)}
.rooms button.on{background:var(--brand);border-color:var(--brand);color:var(--ink)}
.tiers{display:flex;flex-direction:column;gap:10px}
.tier{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 14px;align-items:center;text-align:start;
  border:1px solid var(--line);background:#fff;color:var(--fg);padding:14px 16px;border-radius:12px;cursor:pointer;font-family:var(--f-body);
  transition:transform .3s cubic-bezier(.075,.82,.165,1),box-shadow .3s cubic-bezier(.075,.82,.165,1),border-color .2s}
.tier:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.07)}
.tier[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);box-shadow:inset 0 0 0 1px var(--brand)}
.tier .sw{grid-row:span 2;width:40px;height:40px;border-radius:8px;border:1px solid rgba(0,0,0,.1)}
.tier .nm{font-size:17px;font-weight:700}
.tier .num{font-family:var(--f-num);font-weight:400;color:var(--brand);font-size:13px;margin-inline-end:8px}
.tier .tg{color:var(--muted);font-size:13px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.switch{position:relative;width:46px;height:26px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:999px;background:#c8c8c8;transition:background .2s}
.switch span::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .2s}
.switch input:checked+span{background:var(--brand)}
.switch input:checked+span::after{transform:translateX(-20px)}
.lbl-main{font-weight:700}
.lbl-note{color:var(--muted);font-size:13px;line-height:1.45}
dl.spec{margin:0;display:grid;grid-template-columns:84px minmax(0,1fr);gap:9px 12px;font-size:14px;background:var(--soft);border-radius:12px;padding:14px 16px}
dl.spec dt{color:var(--muted)}
dl.spec dd{margin:0;line-height:1.45}
.fine{color:var(--muted);font-size:12.5px;line-height:1.55;margin:0}
.tour{height:48px;border:0;background:var(--brand);color:var(--ink);font:400 15px var(--f-body);padding:0 20px;border-radius:8px;cursor:pointer;
  transition:transform .3s cubic-bezier(.075,.82,.165,1),background-color .2s,box-shadow .3s;box-shadow:0 2px 6px rgba(0,80,201,.18)}
.tour:hover{background:var(--brand-hover);transform:translate(-1px,-3px);box-shadow:0 10px 22px rgba(0,0,0,.08)}
.tour[aria-pressed="true"]{background:#fff;color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.view{position:relative;min-width:0;min-height:0;overflow:hidden;background:#cfd8de}
.view canvas.gl{display:block;width:100%;height:100%;touch-action:none;outline:none}
[hidden]{display:none!important}
.hud{position:absolute;pointer-events:none;font-family:var(--f-body)}
.hint{top:calc(12px + env(safe-area-inset-top,0px));inset-inline-end:calc(12px + env(safe-area-inset-left,0px));max-width:min(420px,70%);
  background:rgba(255,255,255,.93);color:#1f1f1f;padding:8px 12px;border-radius:8px;font-size:13px;line-height:1.45;box-shadow:0 4px 16px rgba(0,0,0,.12)}
.hint{display:flex;align-items:flex-start;gap:8px}
.hint-x{pointer-events:auto;flex:none;width:28px;height:28px;margin:-4px 0 -4px -6px;border:0;border-radius:6px;background:transparent;color:#6e6e6e;font:700 14px var(--f-body);cursor:pointer}
.hint-x:hover{background:var(--brand-soft);color:var(--brand)}
.hint-open{pointer-events:auto;top:calc(12px + env(safe-area-inset-top,0px));inset-inline-end:calc(12px + env(safe-area-inset-left,0px));width:36px;height:36px;border:0;border-radius:50%;
  background:rgba(255,255,255,.93);color:var(--brand);font:700 17px var(--f-body);cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.12)}
.hint-open:hover{background:#fff}
.hint-x:focus-visible,.hint-open:focus-visible,.lblbtn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.lblbtn{pointer-events:auto;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:max(50%,300px);transform:translateX(-50%);border:0;border-radius:999px;height:40px;padding:0 18px;
  font:700 14px var(--f-body);background:rgba(255,255,255,.95);color:var(--brand);cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.18);white-space:nowrap}
.lblbtn:hover{background:#fff;color:var(--brand-hover)}
.lblbtn[aria-pressed="false"]{background:var(--brand);color:#fff}
.where{top:calc(12px + env(safe-area-inset-top,0px));inset-inline-start:calc(12px + env(safe-area-inset-right,0px));background:var(--brand);color:#fff;
  padding:7px 14px;border-radius:999px;font-weight:700;font-size:14px}
.mini{pointer-events:auto;bottom:calc(12px + env(safe-area-inset-bottom,0px));inset-inline-end:calc(12px + env(safe-area-inset-left,0px));
  width:210px;height:210px;border-radius:12px;background:rgba(255,255,255,.95);box-shadow:0 4px 18px rgba(0,0,0,.18);cursor:crosshair}
.labels{inset:0;overflow:hidden}
.rl{position:absolute;transform:translate(-50%,-50%);background:rgba(255,255,255,.94);color:#1f1f1f;border-radius:8px;padding:3px 8px;
  font-size:12.5px;font-weight:700;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.18);text-align:center;line-height:1.25}
.rl.pl-b{background:#ff4d1a;color:#fff}.rl.pl-b small{color:#ffe3d6}.rl.pl-l{background:var(--brand);color:#fff;font-size:11.5px}.rl.pl-l small{color:#dcebff}
.rl small{display:block;font-weight:400;color:#6e6e6e;font-family:var(--f-num)}
.joy{pointer-events:auto;bottom:calc(22px + env(safe-area-inset-bottom,0px));left:calc(22px + env(safe-area-inset-left,0px));width:120px;height:120px;border-radius:50%;
  background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.55);backdrop-filter:blur(4px);touch-action:none}
.joy i{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:rgba(255,255,255,.85)}
.loading{inset:0;display:grid;place-items:center;background:rgba(255,255,255,.55);color:var(--brand);font-weight:700;font-size:16px}
.floorbtn{pointer-events:auto;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);border:0;border-radius:8px;height:44px;padding:0 20px;
  font:400 14px var(--f-body);background:var(--brand);color:#fff;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.floorbtn:hover{background:var(--brand-hover)}
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .view{grid-row:1}
  .panel{grid-row:2;max-height:46vh;border-inline-end:0;border-top:1px solid var(--line);padding-block:14px 22px;gap:20px}
  h1{font-size:23px}
  .mini{width:132px;height:132px}
  .hint{font-size:12px;max-width:62%}
  .lblbtn{left:auto;right:calc(12px + env(safe-area-inset-right,0px));transform:none;height:36px;padding:0 14px;font-size:13px}
}
@media (prefers-reduced-motion:reduce){.switch span,.switch span::after,.tier,.tour{transition:none}}

/* v2: buildings, apartments */
.apts{display:flex;flex-direction:column;gap:6px;max-height:330px;overflow-y:auto;padding-inline-end:2px}
.apts .rooms-h{margin-top:6px}
.apt{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border:1px solid var(--line);background:#fff;color:var(--fg);font:400 14px var(--f-body);padding:9px 12px;border-radius:8px;cursor:pointer;text-align:start;transition:border-color .2s,background-color .2s}
.apt:hover{border-color:var(--brand)}
.apt[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);box-shadow:inset 0 0 0 1px var(--brand)}
.apt .an{font-weight:700}
.apt .am{color:var(--muted);font-size:12.5px;font-family:var(--f-num)}
.seg.many{grid-template-columns:repeat(4,1fr)}
.rl.apt-l{background:var(--brand);color:#fff;font-size:13px}
.rl.bld-l{background:#1f1f1f;color:#fff;font-size:14px;padding:5px 12px}.rl.bld-l small{color:#cfcfcf}
.rooms button:disabled{opacity:.5;cursor:default}
</style>

/* ============================== GEOMETRY HELPERS ============================== */
function B(p, mat, w,h,d, x,y,z, r=0, ry=0){
  const rr = r ? Math.min(r, w/2-.001, h/2-.001, d/2-.001) : 0;
  const g = rr>0.002 ? new THREE.RoundedBoxGeometry(w,h,d,3,rr) : new THREE.BoxGeometry(w,h,d);
  const m = new THREE.Mesh(g, mat); m.position.set(x, y+h/2, z); m.rotation.y = ry;
  m.castShadow = m.receiveShadow = true; p.add(m); return m;
}
function C(p, mat, rt, rb, h, x,y,z, seg=28, open=false){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg,1,open), mat); m.position.set(x,y+h/2,z);
  m.castShadow = m.receiveShadow = true; p.add(m); return m;
}
function G(p,x,z,ry=0,y=0){ const g=new THREE.Group(); g.position.set(x,y,z); g.rotation.y=ry; p.add(g); return g; }
function meterUV(geo, ox, oy, oz){
  const pos=geo.attributes.position, nor=geo.attributes.normal, uv=geo.attributes.uv;
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i)+ox, y=pos.getY(i)+oy, z=pos.getZ(i)+oz, nx=Math.abs(nor.getX(i)), ny=Math.abs(nor.getY(i));
    if(ny>.5) uv.setXY(i,x,z); else if(nx>.5) uv.setXY(i,z,y); else uv.setXY(i,x,y);
  }
  uv.needsUpdate=true; return geo;
}
function panel(p, mat, w, h, cx, cy, cz, ry, uOff=0){
  const g = new THREE.PlaneGeometry(w,h); const uv=g.attributes.uv, pos=g.attributes.position;
  for(let i=0;i<pos.count;i++) uv.setXY(i, pos.getX(i)+uOff, pos.getY(i)+cy);
  const m=new THREE.Mesh(g,mat); m.position.set(cx,cy,cz); m.rotation.y=ry; m.receiveShadow=true; p.add(m); return m;
}

  if (id==='lux'){ C(g,F.ceramic,.2,.15,.14,0,.87,.26,40); }

function mergeGroup(group){
  if (!MERGE) return;
  group.updateMatrixWorld(true);
  const buckets=new Map(), kill=[];
  group.traverse(o=>{
    if (!o.isMesh || o.userData.room || o.userData.keep) return;
    const mats=Array.isArray(o.material)?o.material:[o.material];
    if (mats.some(m=>m.transparent)) return;
    const geo=o.geometry.index ? o.geometry.toNonIndexed() : o.geometry.clone();
    const inv=new THREE.Matrix4().copy(group.matrixWorld).invert(); const mtx=new THREE.Matrix4().multiplyMatrices(inv,o.matrixWorld);

    if (!geo.attributes.uv){ geo.setAttribute('uv', new THREE.Float32BufferAttribute(new Float32Array(geo.attributes.position.count*2),2)); }
    if (!geo.attributes.normal) geo.computeVertexNormals();
    const groups = Array.isArray(o.material) && geo.groups.length ? geo.groups : [{start:0,count:geo.attributes.position.count,materialIndex:0}];
    for (const gr of groups){
      const m=mats[gr.materialIndex]||mats[0];
      const part=new THREE.BufferGeometry();
      for (const k of keepAttrs){ const at=geo.attributes[k]; const arr=at.array.slice(gr.start*at.itemSize,(gr.start+gr.count)*at.itemSize); part.setAttribute(k,new THREE.BufferAttribute(arr,at.itemSize)); }

    for (let i=0;i<geos.length;i+=1500){ const mg=MERGE(geos.slice(i,i+1500),false); if(!mg) continue; const mesh=new THREE.Mesh(mg,m); mesh.castShadow=cast; mesh.receiveShadow=true; group.add(mesh); }

}

cvs.addEventListener('pointermove',e=>{ if(!drag||state.mode!=='walk'||tween) return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y; drag.moved+=Math.abs(dx)+Math.abs(dy); drag.x=e.clientX; drag.y=e.clientY;
  const k = e.pointerType==='touch' ? .006 : .0042; yaw += dx*k; pitch = THREE.MathUtils.clamp(pitch + dy*k, -1.2, 1.2); });
cvs.addEventListener('pointerup',e=>{ if(!drag) return; const click = drag.moved<6 && performance.now()-drag.t<400; drag=null;
  if (click && state.mode==='walk'){ const hit=pick(e); if(hit) autoTarget=new THREE.Vector2(hit.x,hit.z); } });
const ray=new THREE.Raycaster();
function pick(e){
  const rc=cvs.getBoundingClientRect(); const v=new THREE.Vector2(((e.clientX-rc.left)/rc.width)*2-1, -((e.clientY-rc.top)/rc.height)*2+1);
  ray.setFromCamera(v,camera); const fl=[...LV[state.cur].floors]; if (LEVELS[state.cur].ground && TERRAIN) fl.push(TERRAIN);
  const hits=ray.intersectObjects([houseRoot, siteRoot],true);
  const h=hits.find(h=>fl.includes(h.object)); if(!h) return null;
  const blocker=hits[0]; if(blocker && blocker.distance < h.distance-.05 && !fl.includes(blocker.object)) return null;
  return h.point;
}
const joy=document.getElementById('joy'), knob=document.getElementById('joyKnob'); let jv={x:0,y:0}, jid=null;
joy.addEventListener('pointerdown',e=>{ jid=e.pointerId; joy.setPointerCapture(jid); moveJoy(e); if(state.tour) stopTour(); });
joy.addEventListener('pointermove',e=>{ if(e.pointerId===jid) moveJoy(e); });
const endJoy=()=>{ jid=null; jv={x:0,y:0}; knob.style.transform=''; };
joy.addEventListener('pointerup',endJoy); joy.addEventListener('pointercancel',endJoy);
function moveJoy(e){ const r=joy.getBoundingClientRect(); let x=(e.clientX-r.left-r.width/2)/(r.width/2), y=(e.clientY-r.top-r.height/2)/(r.height/2); const l=Math.hypot(x,y); if(l>1){x/=l;y/=l;} jv={x,y}; knob.style.transform=`translate(${x*36}px,${y*36}px)`; }
function collide(p, Li){
  const rad=.24, cols=LV[Li].colliders;
  for (let it=0; it<3; it++) for (const c of cols){
    const q=segPoint(p.x,p.z,c.a[0],c.a[1],c.b[0],c.b[1]), m=rad+(c.r||0);
    if (q.d<m && q.d>1e-6){ const k=(m-q.d)/q.d; p.x+=(p.x-q.cx)*k; p.z+=(p.z-q.cz)*k; }
  }

// where can one stand: a room or balcony of this level, or (on a ground floor) another building's ground floor or the open site
function spotAt(Li, x, z){
  const L=LEVELS[Li]; const r=roomAtL(L,x,z,true);
  if (r && !r.detail && r.type!=='balcony') return null;
  if (r) return {Li, y:L.y+(r.dy||0), room:r};
  if (L.ground){
    for (let j=0;j<LEVELS.length;j++){ const M_=LEVELS[j]; if (!M_.ground||j===Li) continue; const r2=roomAtL(M_,x,z,true); if (r2 && !r2.detail && r2.type!=='balcony') return null; if (r2) return {Li:j, y:M_.y+(r2.dy||0), room:r2}; }
    if (FOOTS.some(f=>inPoly(f.poly,x,z))) return L.detail ? {Li, y:L.y, room:null} : null;
    if (TERR_BB && x>TERR_BB.x0+8 && x<TERR_BB.x1-8 && z>TERR_BB.z0+8 && z<TERR_BB.z1-8) return {Li, y:terrainH(x,z), room:null, out:true};
    return null;
  }
  if (L.rooms.some(q=>polyDist(q.poly,x,z)<.35) || L.outdoor.some(q=>polyDist(q.poly,x,z)<.3)) return {Li, y:L.y, room:null};
  return null;
}
function walkStep(dt){
  const sp = (keys.ShiftLeft||keys.ShiftRight) ? 3.4 : 1.7;
  let f=0,s=0;
  if(keys.KeyW||keys.ArrowUp) f+=1; if(keys.KeyS||keys.ArrowDown) f-=1;
  if(keys.KeyD) s+=1; if(keys.KeyA) s-=1;
  if(keys.ArrowLeft) yaw+=1.8*dt; if(keys.ArrowRight) yaw-=1.8*dt;
  f += -jv.y; s += jv.x;
  const p=camera.position, ox=p.x, oz=p.z;
  const fw=new THREE.Vector2(-Math.sin(yaw),-Math.cos(yaw)), rt=new THREE.Vector2(Math.cos(yaw),-Math.sin(yaw));
  if (f||s){ autoTarget=null; p.x += (fw.x*f+rt.x*s)*sp*dt; p.z += (fw.y*f+rt.y*s)*sp*dt; }
  else if (autoTarget){ const dx=autoTarget.x-p.x, dz=autoTarget.y-p.z, d=Math.hypot(dx,dz);
    if (d<.12) autoTarget=null; else { const st=Math.min(d,sp*dt); p.x+=dx/d*st; p.z+=dz/d*st; } }
  collide(p,state.cur);
  let spot=spotAt(state.cur,p.x,p.z);
  if (!spot){ p.x=ox; p.z=oz; autoTarget=null; spot=spotAt(state.cur,p.x,p.z); }
  else if (autoTarget && Math.hypot(p.x-ox,p.z-oz)<1e-4) autoTarget=null;
  if (spot && spot.Li!==state.cur){ state.cur=spot.Li; applyState(); }
  const ty=(spot?spot.y:LEVELS[state.cur].y)+EYE; p.y += (ty-p.y)*Math.min(1,dt*9);
  camera.rotation.set(pitch,yaw,0,'YXZ');
}

    for (const r of [...L.rooms, ...L.outdoor]){ pathPoly(r.poly); mx.fillStyle = r.id===currentRoomId && state.mode==='walk' ? '#dce8fb' : (state.apt && r.apt===state.apt.apt && Li===state.apt.L) ? '#e6eefb' : r.type==='wet'?'#dbe6ea': r.type==='balcony'?'#dfe8d6':'#f6f4ef'; mx.fill(); }

    for (const w of L.walls){ if (!w.exterior && !wallNearDetail(L,w)) continue; const [a,b]=toMini(...w.a), [c,d]=toMini(...w.b); mx.lineWidth=w.t>.2?2.6:1.4; mx.beginPath(); mx.moveTo(a,b); mx.lineTo(c,d); mx.stroke(); }
    for (const o of rt.open){ mx.strokeStyle=o.win?'#7aa0b8':'#f6f4ef'; mx.lineWidth=o.win?2:3.2; const [a,b]=toMini(o.ax,o.az), [c,d]=toMini(o.bx,o.bz); mx.beginPath(); mx.moveTo(a,b); mx.lineTo(c,d); mx.stroke(); }
  }

    mx.fillStyle='rgba(0,80,201,.28)'; mx.beginPath(); mx.moveTo(px,py); mx.arc(px,py,30,ang-.55,ang+.55); mx.closePath(); mx.fill();
    mx.fillStyle='#0050c9'; mx.beginPath(); mx.arc(px,py,5.5,0,7); mx.fill(); mx.strokeStyle='#fff'; mx.lineWidth=2; mx.stroke(); }
  // north arrow
  const [nx,nz]=NORTH(), ax=Wd-22, ay=40; mx.save(); mx.translate(ax,ay); mx.rotate(Math.atan2(nx,-nz)); mx.fillStyle='#1f1f1f'; mx.beginPath(); mx.moveTo(0,-13); mx.lineTo(6,7); mx.lineTo(0,3); mx.lineTo(-6,7); mx.closePath(); mx.fill(); mx.restore();
  mx.fillStyle='#1f1f1f'; mx.font='700 13px Arimo, Arial'; mx.textAlign='center'; mx.fillText('צ',ax,ay+24);
  mx.font='700 17px Arimo, Arial'; mx.textAlign='right'; mx.fillText(L ? `${L.bldName} · ${L.name}` : 'תוכנית מגרש', Wd-44, 24);
}
mini.addEventListener('click',e=>{
  const rc=mini.getBoundingClientRect(); const [x,z]=fromMini((e.clientX-rc.left)*mini.width/rc.width,(e.clientY-rc.top)*mini.height/rc.height);

/* ============================== BUILD ============================== */
const GLOW=[0,1,2].map(i=>new THREE.MeshBasicMaterial({color:new THREE.Color(['#ffd29a','#ffe2b8','#f5c27e'][i]).multiplyScalar([2.4,1.9,1.5][i])}));
function buildGlow(L, rt){
  for (const w of L.walls){ for (const op of w.open){ if (op.type!=='window' && op.type!=='slider') continue;
    const cx=w.a[0]+w.u[0]*op.c, cz=w.a[1]+w.u[1]*op.c, d=w.t/2+.18;
    const rp=roomAtL(L,cx+w.n[0]*d,cz+w.n[1]*d,false), rn=roomAtL(L,cx-w.n[0]*d,cz-w.n[1]*d,false);
    if (!!rp===!!rn) continue; const sg=rp?1:-1, h=(Math.floor(cx*13.7+cz*7.3+L.idx*5)%997+997)%997, room=rp||rn;
    if (!room.detail){ const cu=new THREE.Mesh(new THREE.PlaneGeometry(Math.max(.2,op.w-.08),Math.max(.2,op.h-.06)),CURTAIN[h%3]);
      cu.position.set(cx+w.n[0]*sg*(w.t/2+.09),(op.sill||0)+op.h/2,cz+w.n[1]*sg*(w.t/2+.09)); cu.rotation.y=Math.atan2(-w.n[0]*sg,-w.n[1]*sg); cu.receiveShadow=true; rt.struct.add(cu); }
    if (h%10<3) continue;
    const pl=new THREE.Mesh(new THREE.PlaneGeometry(Math.max(.2,op.w-.12),Math.max(.2,op.h-.12)),GLOW[h%3]);
    pl.position.set(cx+w.n[0]*sg*(w.t/2+.05),(op.sill||0)+op.h/2,cz+w.n[1]*sg*(w.t/2+.05)); pl.rotation.y=Math.atan2(-w.n[0]*sg,-w.n[1]*sg); rt.glow.add(pl); } }
}
function wallNearDetail(L, w){
  // interior walls are built only where they bound a room that is shown in detail
  const mx=(w.a[0]+w.b[0])/2, mz=(w.a[1]+w.b[1])/2, d=w.t/2+.18;
  for (const t of [.2,.5,.8]){ const px=w.a[0]+w.u[0]*w.len*t, pz=w.a[1]+w.u[1]*w.len*t;
    for (const sg of [1,-1]){ const r=roomAtL(L,px+w.n[0]*d*sg,pz+w.n[1]*d*sg,false); if (r && r.detail) return true; } }
  return false;
}
const curtainTex = (key, base, kind) => ctex(key,256,(x,N)=>{ x.fillStyle=base; x.fillRect(0,0,N,N);
  if (kind==='blind'){ for(let y=0;y<N;y+=8){ x.fillStyle='rgba(0,0,0,.10)'; x.fillRect(0,y+6,N,2); x.fillStyle='rgba(255,255,255,.10)'; x.fillRect(0,y,N,2); } }
  else { for(let i=0;i<N;i++){ const v=Math.sin(i/N*Math.PI*2*9)*.5+.5; x.fillStyle=`rgba(0,0,0,${.03+v*.11})`; x.fillRect(i,0,1,N); } }
  fine(x,N,6,77); },[1,1]);
const CURTAIN=[M({map:curtainTex('cur1','#efe9df','fold'), roughness:.95},true), M({map:curtainTex('cur2','#ddd2bf','fold'), roughness:.95},true), M({map:curtainTex('cur3','#cfcfcb','blind'), roughness:.8},true)];
const capM = M({color:'#e4e1db', roughness:.95}, true);
// aluminium chevron louvres that screen the AC / laundry niches (detail "אלמנט המסתור": profiles 11.5 cm with 3 cm gaps, 195 cm high)
const louvreM = M({map:ctex('louvre',256,(x,N)=>{ x.fillStyle='#cfd2d4'; x.fillRect(0,0,N,N); const p=N/7; for(let i=0;i<7;i++){ const g=x.createLinearGradient(i*p,0,i*p+p,0); g.addColorStop(0,'#e6e8ea'); g.addColorStop(.45,'#c3c7ca'); g.addColorStop(.78,'#9aa0a5'); g.addColorStop(.8,'#3c4246'); g.addColorStop(1,'#3c4246'); x.fillStyle=g; x.fillRect(i*p,0,p,N); } fine(x,N,5,91); },[1/1.03,1]), roughness:.45, metalness:.5}, true);
function buildScreens(L, rt){
  for (const r of L.rooms){ if (r.kind!=='service') continue;
    const P=r.poly;
    for (let i=0;i<P.length;i++){ const a=P[i], b=P[(i+1)%P.length], len=Math.hypot(b[0]-a[0],b[1]-a[1]); if (len<.5) continue;
      const u=[(b[0]-a[0])/len,(b[1]-a[1])/len], n=[-u[1],u[0]], mx=(a[0]+b[0])/2, mz=(a[1]+b[1])/2;
      const walled=L.walls.some(w=>Math.abs(w.u[0]*u[1]-w.u[1]*u[0])<.05 && Math.abs((mx-w.a[0])*w.n[0]+(mz-w.a[1])*w.n[1])<.15 && segPoint(mx,mz,w.a[0],w.a[1],w.b[0],w.b[1]).d<.2);
      if (walled) continue;
      let out=n; if (inPoly(P,mx+n[0]*.2,mz+n[1]*.2)) out=[-n[0],-n[1]];
      if (roomAtL(L,mx+out[0]*.3,mz+out[1]*.3,true)) continue;
      const h=Math.min(1.95,L.H-.05), geo=new THREE.BoxGeometry(len,h,.05); const uv=geo.attributes.uv, pos=geo.attributes.position; for(let k=0;k<pos.count;k++) uv.setXY(k,pos.getX(k)+len/2,pos.getY(k)+h/2);
      const m=new THREE.Mesh(geo,louvreM); m.position.set(mx+out[0]*.03,h/2+.02,mz+out[1]*.03); m.rotation.y=Math.atan2(-u[1],u[0]); m.castShadow=m.receiveShadow=true; rt.struct.add(m); } }
}
function build(id){
  if (houseRoot){ scene.remove(houseRoot); disposeTree(houseRoot); }
  MATS.forEach(m=>m.dispose()); MATS=[]; EMIT=[]; PENDANTS=[];
  F=tierMats(id); F.id=id;
  for (const k of ['floorLiving','floorBed','floorWet','deck']) if (F[k]){ F[k].polygonOffset=true; F[k].polygonOffsetFactor=-1; F[k].polygonOffsetUnits=-4; }
  houseRoot=new THREE.Group();
  LV=LEVELS.map(L=>{
    const root=new THREE.Group(); root.position.y=L.y; houseRoot.add(root);
    const rt={root, colliders:[], floors:[], open:[]};
    for (const k of ['struct','slab0','slab','furn','fit','fix','lights','glow']){ rt[k]=new THREE.Group(); root.add(rt[k]); }
    for (const w of L.walls){ if (!w.exterior && !wallNearDetail(L,w)) continue; buildWall2(L, rt, rt.struct, w, F); }
    buildFloors2(L, rt, rt.struct, F);
    for (const r of L.railings) buildRailing2(L, rt, rt.struct, r);
    for (const o of L.pergolas) buildPergola2(L, rt.struct, o);
    return rt;
  });
  for (const B_ of BLDS){
    buildSlabs2(B_, F); buildRoofExtras(B_, F);
    B_.levels.forEach((L,i)=>{ const rt=LV[LEVELS.indexOf(L)], up=B_.levels[i+1]; for (const s of L.stairs) if (up || (s.from_level!=null && s.to_level!=null)) buildStairs2(L, rt, rt.struct, s, up?up.y-L.y:3); });
  }
  LEVELS.forEach((L,i)=>{ const rt=LV[i]; buildFurniture2(L, rt, rt.furn, F, id); });
  LEVELS.forEach((L,i)=>{ const rt=LV[i]; buildFixtures2(L, rt.fix, F, id); buildGlow(L, rt); buildScreens(L, rt); });
  LEVELS.forEach((L,i)=>{ if (!L.detail) return; const hidden=L.rooms.filter(r=>!r.detail); if (!hidden.length) return;
    const mp=mpUnion(hidden.map(r=>r.poly)); const gc=slabGeom(mp, L.H, SLAB*.6); if (gc){ const m=new THREE.Mesh(gc,[capM,capM]); m.castShadow=m.receiveShadow=true; LV[i].struct.add(m); } });
  LV.forEach(rt=>{ for (const k of ['struct','slab0','slab','furn','fit','fix']) mergeGroup(rt[k]); });
  houseRoot.traverse(n=>{ if(n.isMesh && n.material && !Array.isArray(n.material) && n.material.transparent){ n.castShadow=false; n.renderOrder=2; } });
  scene.add(houseRoot);
  poolKey='';
  applyState();
}

/* ============================== LOOP ============================== */
function resize(){ const w=view.clientWidth, h=view.clientHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(view);
const whereEl=document.getElementById('where');
let last=performance.now(), miniT=0;
function loop(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  if (tween){
    const k=Math.min(1,Math.max(0,(now-tween.start)/tween.dur)), e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;   // rAF time can precede tween.start: never extrapolate
    camera.position.lerpVectors(tween.p0,tween.p1,e); controls.target.lerpVectors(tween.t0,tween.t1,e); camera.lookAt(controls.target);
    if (k>=1){ const d=tween.done; tween=null; d&&d(); if(state.mode!=='walk') controls.update(); }
  } else if (state.mode==='walk') walkStep(dt);
  else controls.update();
  if (state.mode==='walk'){
    const p=camera.position, sp=spotAt(state.cur,p.x,p.z), r=sp&&sp.room, L=LEVELS[state.cur];
    if (r && r.id!==currentRoomId){ currentRoomId=r.id; if(state.eve) placePool(state.cur, R(r.id)); updateUI(); }
    whereEl.hidden=false; whereEl.textContent = (r ? r.name+(r.apt&&r.apt!=='common'?' · דירה '+r.apt:'') : sp&&sp.out ? 'בחצר' : 'מעבר') + ' · ' + L.name + ' · ' + L.bldName;
  } else whereEl.hidden=true;
  updateLabels();
  petsUpdate(now, dt);
  if (now-miniT>80){ drawMini(); miniT=now; }
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}

/* ============================== START ============================== */
function start(){
  normalizeProject(PROJECT);
  PENDANTS=[];
  computeApts();
  document.getElementById('projTitle').textContent = PROJECT.name || 'פרויקט מגורים';
  document.getElementById('projEyebrow').textContent = PROJECT.place || '';

  document.getElementById('projSub').textContent = PROJECT.subtitle || `${BLDS.length} בניינים · ${nA} דירות · עד ${nF} קומות`;
  document.getElementById('fine').textContent = PROJECT.fine || '';
  buildSite(); buildPets(); miniBounds(); renderNav(); renderLabels();
  build(TIER);
  const st=PROJECT.start||{}; if (st.bld && BLD(st.bld)){ state.bld=st.bld; const B_=BLD(st.bld); const i=B_.levels.findIndex(L=>Math.abs(L.level-(+st.level||0))<.3); state.view = i>=0 ? i : -1;
    if (st.apt!=null){ const a=APTS.find(a=>a.bld===st.bld && String(a.apt)===String(st.apt)); if (a) state.apt={L:a.L, apt:a.apt}; } renderNav(); }
  setMode('doll');
}
resize();
start();
loadingEl.hidden=true;
requestAnimationFrame(loop);
window.__studio={state,setMode,goRoom,build,selectBld,selectFloor,selectApt,camera,APTS:()=>APTS,LEVELS:()=>LEVELS,terrainH,PRESETS,flyTo,controls,
  pets:()=>PETS, lookAtPets:i=>lookAtPets(PETS[i||0]), petsTime:t=>{ petsFixedT=t; },
  edges:id=>{ const r=R(id); const L=LEVELS[r.L], rt=LV[r.L]; return roomEdges(L,rt,r).map(e=>({len:+e.len.toFixed(2), free:+freeLen(e).toFixed(2), depth:+e.depth.toFixed(2), t:e.t, ints:e.ints.map(i=>[+i.a.toFixed(2),+i.b.toFixed(2)])})); },
  rooms:()=>ALLROOMS.filter(r=>r.detail).map(r=>[r.id,r.name,r.kind,r.apt,+area(r).toFixed(1),!!r.focus,!!r.view]),
  layers:(on)=>{ for (const k of ['struct','slab0','slab','furn','fit','fix','glow']) LV.forEach(rt=>{ rt[k].visible = on.includes(k); }); siteRoot.visible=on.includes('site'); },
  why:id=>{ const r=R(id), L=LEVELS[r.L], rt=LV[r.L], P=r.poly, out=[];
    for (let i=0;i<P.length;i++){ const a=P[i], b=P[(i+1)%P.length], len=Math.hypot(b[0]-a[0],b[1]-a[1]); if(len<.5) continue; const u=[(b[0]-a[0])/len,(b[1]-a[1])/len]; let n=[-u[1],u[0]]; const mx=(a[0]+b[0])/2, mz=(a[1]+b[1])/2; if(!inPoly(P,mx+n[0]*.15,mz+n[1]*.15)) n=[-n[0],-n[1]];
      const proj=(x,z)=>(x-a[0])*u[0]+(z-a[1])*u[1], perp=(x,z)=>(x-a[0])*n[0]+(z-a[1])*n[1];
      const ops=rt.open.filter(o=>!(o.win&&o.sill>=1.0) && Math.abs(perp(o.ax,o.az))<=.18 && Math.abs(perp(o.bx,o.bz))<=.18).map(o=>[+proj(o.ax,o.az).toFixed(2),+proj(o.bx,o.bz).toFixed(2),o.type,o.sill]);
      const walls=L.walls.filter(w=>w.kind!=='low' && Math.abs(w.u[0]*u[1]-w.u[1]*u[0])<=.035 && Math.abs(perp(w.a[0],w.a[1]))<=.16).map(w=>[+proj(w.a[0],w.a[1]).toFixed(2),+proj(w.b[0],w.b[1]).toFixed(2),w.t]);
      out.push({i,len:+len.toFixed(2),ops,walls}); } return out; } };
})();
