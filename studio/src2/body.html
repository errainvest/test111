      <h2>מצב תצוגה</h2>
      <div class="seg" role="group" aria-label="מצב תצוגה">
        <button id="m-doll" data-mode="doll" aria-pressed="true">מבט־על</button>

        <button id="m-walk" data-mode="walk" aria-pressed="false">סיור</button>
        <button id="m-ext" data-mode="ext" aria-pressed="false">חוץ</button>

      <div class="seg" role="group" aria-label="בניין" id="bldSeg"></div>
      <div class="seg many" role="group" aria-label="קומה" id="levelSeg" hidden></div>
      <button class="tour" id="tourBtn" aria-pressed="false">סיור אוטומטי בפרויקט</button>
    </section>

    <section class="sec">
      <h2>דירות</h2>
      <div class="apts" id="apts"></div>
    </section>

    <section class="sec" id="roomsSec" hidden>
      <h2>מעבר לחדר</h2>
      <div class="rooms"><div class="rooms-row" id="rooms"></div></div>
    </section>

    <section class="sec">
      <h2>סגנון עיצוב</h2>
      <div class="tiers" id="tiers"></div>
    </section>

    <section class="sec">
      <div class="row">
        <div><div class="lbl-main">ריהוט</div><div class="lbl-note" id="furnNote"></div></div>
        <label class="switch" aria-label="הצגת ריהוט"><input type="checkbox" id="furn" checked><span></span></label>
      </div>
      <div class="row" id="plotRow">
        <div><div class="lbl-main">גבולות מגרש וקווי בניין</div><div class="lbl-note" id="plotNote"></div></div>
        <label class="switch" aria-label="הדגשת גבולות המגרש"><input type="checkbox" id="plotT" checked><span></span></label>
      </div>
      <div class="seg two" role="group" aria-label="שעת היום">
        <button id="t-day" data-time="day" aria-pressed="true">☀ יום</button>
        <button id="t-eve" data-time="eve" aria-pressed="false">☾ ערב</button>
      </div>
    </section>

    <section class="sec">
      <h2>מה כולל העיצוב</h2>
      <dl class="spec" id="spec"></dl>
    </section>

    <p class="fine" id="fine"></p>
  </aside>

  <main class="view" id="view">
    <div class="hud labels" id="labels"></div>
    <div class="hud where" id="where" hidden></div>
    <div class="hud hint" id="hint"><span id="hintTxt"></span><button class="hint-x" id="hintClose" aria-label="סגירת ההסבר" title="סגירת ההסבר">✕</button></div>
    <button class="hud hint-open" id="hintOpen" aria-label="הצגת ההסבר" title="הצגת ההסבר" hidden>?</button>
    <canvas class="hud mini" id="mini" width="420" height="420" aria-label="מפה: לחיצה מעבירה לנקודה"></canvas>
    <button class="hud floorbtn" id="floorBtn" hidden></button>
    <button class="hud lblbtn" id="lblBtn" aria-pressed="true">הסתרת תוויות</button>
    <div class="hud joy" id="joy" hidden><i id="joyKnob"></i></div>
    <div class="hud loading" id="loading">בונה את הבניינים…</div>
  </main>
